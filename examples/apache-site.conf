# EXAMPLE: site-only Apache policy; test direct backend requests too.
<Directory "/home/journal/public_html">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    <FilesMatch "(?i)^(?!index[.]php$).*[.](php[0-9]*|phtml|phar|cgi|pl|py|sh)([.]|$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory "/home/journal/ojs-private">
    AllowOverride None
    Require all denied
</Directory>
<Directory "/home/journal/public_html/public">
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|html?|js|cgi|pl|py|sh)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/(files|cache|tools|dbscripts)(/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "(?i)^/(?!index\.php(?:/|$)).*\.(php[0-9]*|phtml|phar|cgi|pl|py|sh)(/|\.|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(^\.|\.(inc|ini|sql|log|bak|old|swp)$|^composer\.(json|lock)$)">
    Require all denied
</FilesMatch>
<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'"
</IfModule>
