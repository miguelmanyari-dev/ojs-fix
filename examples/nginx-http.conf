# Dedicated rate limit: only this OJS virtual host uses the zone.
map "$request_method:$uri" $ojs_fix_journal_auth_key {
    default "";
    ~^POST:/index\.php/[^/]+/(login/signIn|user/register)$ $binary_remote_addr;
}
limit_req_zone $ojs_fix_journal_auth_key zone=ojs_fix_journal_auth:1m rate=5r/m;
