# EXAMPLE: merge into this site only; see docs/OPERATIONS.md.
set $ojs_fix_journal_maintenance 0;
if (-f /etc/nginx/ojs-fix-journal-maintenance.flag) { set $ojs_fix_journal_maintenance 1; }
if ($remote_addr ~ "^(127\.0\.0\.1|203\.0\.113\.10|::1)$") { set $ojs_fix_journal_maintenance 0; }
if ($ojs_fix_journal_maintenance = 1) { return 503; }
client_max_body_size 20m;
limit_req zone=ojs_fix_journal_auth burst=10 nodelay;
limit_req_status 429;
limit_req zone=ojs_fix_journal_upload burst=20 nodelay;
location = /files { return 403; }
location ^~ /files/ { return 403; }
location = /cache { return 403; }
location ^~ /cache/ { return 403; }
location ^~ /tools/ { return 403; }
location ^~ /dbscripts/ { return 403; }
if ($uri ~* "^/(?!index[.]php(?:/|$)).*[.](php[0-9]*|phtml|phar|cgi|pl|py|sh)(?:/|[.]|$)") { return 403; }
location ~* /\.(?!well-known(?:/|$)) { return 403; }
location ^~ /public/ {
    root /home/journal/public_html;
    location ~* \.(php[0-9]*|phtml|phar|html?|js|cgi|pl|py|sh)(?:/|\.|$) { return 403; }
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
}
