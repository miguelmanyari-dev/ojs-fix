
; OJS account-only restrictions. No change to other PHP pools.
security.limit_extensions = .php
rlimit_core = 0
request_terminate_timeout = 180s
php_admin_value[open_basedir] = /home/journal:/etc/pki/tls/certs:/usr/share/zoneinfo:/usr/share/fonts
php_admin_value[session.save_path] = /home/journal/tmp/sessions
php_admin_value[upload_tmp_dir] = /home/journal/tmp/uploads
php_admin_value[sys_temp_dir] = /home/journal/tmp
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[allow_url_include] = off
php_admin_value[error_log] = /home/journal/tmp/php-error.log
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
php_admin_value[post_max_size] = 20M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[max_execution_time] = 120
